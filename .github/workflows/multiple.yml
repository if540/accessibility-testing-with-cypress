name: React + A11y CI/CD

on:
  workflow_dispatch:
    inputs:
      site:
        description: '指定要測試的站點 (可空，跑全部)'
        required: false
        default: ''
      deploy_react:
        description: '是否重新部署 React (yes/no)'
        required: true
        default: 'no'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ 安裝 pnpm
      - uses: pnpm/action-setup@v2
        with:
          version: 8

      # 3️⃣ 安裝專案依賴
      - name: Install dependencies
        run: pnpm install

      # 4️⃣ Cypress + axe 測試
      - name: Run Accessibility Tests
        run: |
          if [ "${{ github.event.inputs.site }}" != "" ]; then
            echo "Running tests only for site: ${{ github.event.inputs.site }}"
            pnpm run test:a11y:url -- --site=${{ github.event.inputs.site }}
          else
            echo "Running tests for all sites"
            pnpm run test:a11y:url
          fi
        continue-on-error: true

      # 5️⃣ 部署 Cypress report 到 gh-pages/a11y-reports
      - name: Deploy Accessibility Reports
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: cypress/reports
          destination_dir: a11y-reports
          commit_message: "Deploy A11y Reports [skip ci]"

      # 6️⃣ 選擇性部署 React build
      - name: Deploy React App (optional)
        if: ${{ github.event.inputs.deploy_react == 'yes' }}
        run: pnpm run build
      - name: Deploy React build to gh-pages
        if: ${{ github.event.inputs.deploy_react == 'yes' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: build
          destination_dir: react-app
          commit_message: "Deploy React App [skip ci]"
