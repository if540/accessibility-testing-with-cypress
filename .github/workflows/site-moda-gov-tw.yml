name: Moda Gov A11y

on:
  repository_dispatch:
    types: [gitlab-merge]

  workflow_dispatch:
    inputs:
      clean_cache:
        description: '是否清除 pnpm store 快取'
        required: true
        default: 'false'
      keep_report_files:
        description: '是否保留報告檔案'
        required: true
        default: 'true'
      base_url:
        description: '測試站點的 base URL'
        required: true
        default: 'https://moda.gov.tw'
      spec_file:
        description: '測試檔案'
        required: true
        default: 'moda-gov-tw.spec.cy.js'

jobs:
  a11y-moda-gov-tw:
    runs-on: ubuntu-latest
    env: 
      clean_cache: ${{ github.event.inputs.clean_cache || 'false' }}
      keep_report_files: ${{ github.event.inputs.keep_report_files || 'true' }}
      base_url: ${{ github.event.inputs.base_url || 'https://moda.gov.tw' }}
      spec_file: ${{ github.event.inputs.spec_file || 'moda-gov-tw.spec.cy.js' }}
    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ 安裝 pnpm
      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Print payload
        run: echo ${toJson(github.event.client_payload) || 'no payload'}

      # 先清除舊的 pnpm store 快取
      - name: Remove old pnpm store cache
        if: ${{ env.clean_cache == 'true' }}
        run: rm -rf ~/.local/share/pnpm/store

      # 快取 pnpm store
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # 3️⃣ 安裝專案依賴
      - name: Install dependencies
        run: pnpm install

      # 4️⃣ 從 gh-pages 拉取 reports-data/db.json
      - name: Fetch reports-data/db.json from gh-pages
        run: |
          curl -L https://github.com/if540/accessibility-testing-with-cypress/raw/gh-pages/reports-data/db.json -o public/data/db.json

      # 5️⃣ Cypress + axe 測試
      - name: Run Accessibility Tests
        run: pnpm exec cross-env CYPRESS_BASE_URL=${{ env.base_url }}/ cypress run --spec 'cypress/e2e/sites/**/${{ env.spec_file }}' --headless
        continue-on-error: true

      # 6️⃣ 部署 Cypress report 到 gh-pages/a11y-reports
      - name: Deploy Accessibility Reports
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: cypress/reports
          destination_dir: a11y-reports
          keep_files: ${{ env.keep_report_files == 'true' }}
          commit_message: "Deploy A11y Reports [skip ci]"

      # 7️⃣ 部署 db.json
      - name: Deploy reports-data/db.json
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: public/data
          destination_dir: reports-data
          commit_message: "Deploy reports-data/db.json [skip ci]"